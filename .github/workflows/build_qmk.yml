name: Build Custom Keychron C3 Pro Firmware

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install QMK Compiler & Clone Repository
        run: |
          python3 -m pip install qmk
          # Tells QMK to setup the repository directly inside the runner home directory (~/qmk_firmware)
          qmk setup Keychron/qmk_firmware -b playground --yes

      - name: Inject Custom RAW HID Modifications
        run: |
          cd ~/qmk_firmware
          
          # 1. Force add the compilation overrides into the rule mapping configuration
          echo "RAW_ENABLE = yes" >> keyboards/keychron/c3_pro/iso/rules.mk
          echo "VIA_ENABLE = yes" >> keyboards/keychron/c3_pro/iso/rules.mk
          
          # 2. Append your lightweight packet routing parser directly to the core keymap file
          # This extracts the exact index and brightness values from your Pi Pico's array.
          cat << 'EOF' >> keyboards/keychron/c3_pro/iso/keymaps/default/keymap.c

          #ifdef RAW_ENABLE
          #define VIA_CMD_LIGHTING  0x07
          #define VIA_SUB_SET_PIXEL 0x07
          void raw_hid_receive_kb(uint8_t *data, uint8_t length) {
              if (data[0] == VIA_CMD_LIGHTING && data[1] == VIA_SUB_SET_PIXEL) {
                  uint8_t led_index = data[2];
                  uint8_t brightness = data[3];
                  if (led_index < BACKLIGHT_LED_COUNT) {
                      backlight_set_value_at_index(led_index, brightness);
                  }
              }
          }
          #endif
          EOF

      - name: Compile Keyboard Binary
        run: |
          cd ~/qmk_firmware
          qmk compile -kb keychron/c3_pro/iso -km default

      - name: Upload Finished Firmware File
        uses: actions/upload-artifact@v4
        with:
          name: keychron_c3_pro_custom_firmware
          path: /home/runner/qmk_firmware/.build/*.bin
