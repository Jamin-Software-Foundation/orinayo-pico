name: Build Keychron V6 ISO Encoder Custom QMK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout Custom Keymap Code
        uses: actions/checkout@v4

      - name: Setup QMK and Inject Custom Keymap
        run: |
          # Hydrate repository framework targets
          qmk setup -y
          
          # Use standard fallback directory path for this official builder container
          QMK_HOME="/qmk_firmware"
          if [ ! -d "$QMK_HOME" ]; then QMK_HOME="/root/qmk_firmware"; fi
          
          echo "Target build tree home: $QMK_HOME"
          
          # Inject your specific keymap directly into the source target directory
          TARGET_DIR="$QMK_HOME/keyboards/keychron/v6/iso_encoder/keymaps/pico_led"
          mkdir -p "$TARGET_DIR"
          cp keymap.c "$TARGET_DIR/keymap.c"
          cp rules.mk "$TARGET_DIR/rules.mk"
          
          # Explicitly pass the home tree location into the next steps via environment variables
          echo "WORKSPACE_QMK_HOME=$QMK_HOME" >> $GITHUB_ENV

      - name: Compile via Native Make System
        run: |
          cd ${{ env.WORKSPACE_QMK_HOME }}
          
          # Fetch ChibiOS and critical matrix submodules needed for Keychron architecture
          make git-submodule
          
          # Trigger direct compiler chain bypassing the qmk wrapper layer entirely
          make keychron/v6/iso_encoder:pico_led

      - name: Export Flashable Binary File
        uses: actions/upload-artifact@v4
        with:
          name: keychron_v6_iso_encoder_firmware
          path: ${{ env.WORKSPACE_QMK_HOME }}/.build/keychron_v6_iso_encoder_pico_led.bin
          if-no-files-found: warn
