name: Build Keychron V6 ISO Encoder Custom QMK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout Custom Keymap Code
        uses: actions/checkout@v4

      - name: Setup QMK Repository Structure
        run: |
          # 1. This re-enables the 'compile' command by hydrating the QMK ecosystem
          qmk setup -y
          
          # 2. Extract the actual workspace location dynamically
          QMK_HOME=$(qmk config user.qmk_home | cut -d'=' -f2 | xargs)
          if [ -z "$QMK_HOME" ]; then QMK_HOME="/qmk_firmware"; fi
          
          echo "Injecting files into QMK Tree: $QMK_HOME"
          
          # 3. Formulate target map directory
          TARGET_DIR="$QMK_HOME/keyboards/keychron/v6/iso_encoder/keymaps/pico_led"
          mkdir -p "$TARGET_DIR"
          
          # 4. Safely push local keymap files into the compiler sandbox
          cp keymap.c "$TARGET_DIR/keymap.c"
          cp rules.mk "$TARGET_DIR/rules.mk"

      - name: Compile Custom V6 Firmware
        run: |
          # The command will now parse natively without throwing sub-choice errors
          qmk compile -kb keychron/v6/iso_encoder -km pico_led

      - name: Export Flashable Binary File
        uses: actions/upload-artifact@v4
        with:
          name: keychron_v6_iso_encoder_firmware
          path: |
            /qmk_firmware/.build/keychron_v6_iso_encoder_pico_led.bin
            /root/qmk_firmware/.build/keychron_v6_iso_encoder_pico_led.bin
          if-no-files-found: warn
