name: Build orinayo-pico UF2

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "./**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "./**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build orinayo-pico UF2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install build utilities (excluding the old apt compiler)
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            python3 \
            git \
            ninja-build

      # 2. Use a verified action to inject the modern Arm GNU Toolchain
      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Check out Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      - name: Check out BTstack
        run: echo "BTstack is a pico-sdk submodule – already checked out."

      # 3. Build targeting the RP2350 core
      - name: Configure CMake
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_BOARD: pico2_w
          PICO_PLATFORM: rp2350-arm-s
        run: |
          cmake -S . -B ./build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DPICO_BOARD=${PICO_BOARD} \
            -DPICO_PLATFORM=${PICO_PLATFORM} \
            -DPICO_SDK_PATH=${PICO_SDK_PATH}

      - name: Build
        run: cmake --build ./build --parallel

      - name: Locate UF2
        id: locate_uf2
        run: |
          UF2=$(find ./build -name "*.uf2" | head -1)
          echo "uf2_path=${UF2}" >> "$GITHUB_OUTPUT"
          echo "Found UF2: ${UF2}"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: orinayo-pico
          path: ${{ steps.locate_uf2.outputs.uf2_path }}
          if-no-files-found: error
